name: Férias à Vista - Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruir o projeto Android incluído neste workflow
        run: |
          cat > ferias-a-vista-source.zip.b64 <<'FERIAS_SOURCE_EOF'
